name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python3 scripts/sync_skills.py --check
      - run: python3 scripts/beispiele_bauen.py --check
      - name: Repo prüft sich selbst
        run: claude-team audit . --schwelle warnung
      - name: Keine Secrets oder personenbezogenen Daten im Repo
        run: claude-team scannen .

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          schwelle: warnung
          sarif: true
